<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes Auth App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Notes Auth App</h1>

    <section class="card">
      <h2>Register</h2>
      <form id="registerForm">
        <input id="registerEmail" type="email" placeholder="Email" required>
        <input id="registerPassword" type="password" placeholder="Password" required>
        <button type="submit">Register</button>
      </form>
    </section>

    <section class="card">
      <h2>Login</h2>
      <form id="loginForm">
        <input id="loginEmail" type="email" placeholder="Email" required>
        <input id="loginPassword" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </section>

    <section class="card">
      <h2>Current User</h2>
      <button id="meBtn">Get current user</button>
      <button id="logoutBtn">Logout</button>
      <p id="userInfo">Not logged in</p>
    </section>

    <section class="card">
      <h2>Create Note</h2>
      <form id="noteForm">
        <input id="noteTitle" type="text" placeholder="Note title" required>
        <textarea id="noteContent" placeholder="Note content"></textarea>
        <button type="submit">Create Note</button>
      </form>
    </section>

    <section class="card">
      <h2>My Notes</h2>
      <button id="loadNotesBtn">Load Notes</button>
      <ul id="notesList"></ul>
    </section>

    <p id="message"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
